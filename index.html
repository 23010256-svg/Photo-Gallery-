<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery Final Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
        <p>Welcome to my responsive photo gallery showcasing beautiful nature landscapes. Explore the collection across different viewports and user settings!</p>
    </header>

    <main>
        <div class="gallery">
            <figure>
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Scenic mountain landscape with a calm alpine lake during sunset">
                <figcaption>Alpine Lake Sunset</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Dense green pine forest bathed in soft morning sunlight">
                <figcaption>Misty Pine Forest</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1426604966848-d7adac902bff" alt="Majestic snow-covered mountain peaks under a clear blue sky">
                <figcaption>Snowy Mountain Peaks</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d" alt="Sunlight streaming through tall autumn trees in a golden forest">
                <figcaption>Autumn Sunlight</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07" alt="Vibrant wildflower meadow blooming beneath a dramatic cloudy sky">
                <figcaption>Wildflower Meadow</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Photo Gallery Project. All rights reserved.</p>
    </footer>
</body>
</html>
